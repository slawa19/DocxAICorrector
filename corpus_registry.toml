min_text_similarity = 0.96
require_numbered_lists_preserved = false
require_nonempty_output = true
forbid_heading_only_collapse = true
require_pdf_conversion = true
default_run_profile = "ui-parity-translate-benchmark-advisory"
tags = ["pdf", "translation", "benchmark-only", "mazzucato", "full-document"]
provenance = "Non-Lietaer full-book PDF benchmark for WS-2 role-aware formatting transfer generalization."

