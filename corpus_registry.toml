max_unmapped_source_paragraphs = 12
max_unmapped_target_paragraphs = 6
max_heading_level_drift = 1
# torn_list_item_count measured through the same extraction this gate runs: 0 on
# every profile at HEAD. The importer of 2026-06-18 — before the soft-wrap
# continuation merge of 2026-06-22 — scored 67 / 74 / 133 on the three benchmark
# books and 117 on the held-out one, so a zero ceiling is a real bar, not a vacuum.
