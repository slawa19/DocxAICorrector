# The STANDALONE audiobook operation, which the registry had no way to express: every
# profile above runs translate or edit. The first audiobook run in the project's
# history (2026-08-04, Money & Sustainability, spec 054) therefore had to inject its profile
# in memory — which means it was not reproducible, and a second run could not have been
# compared against it.
#
# Spec 070 FR-001: the input is an already translated document, so the profile carries no
# language pair (a pair would be a fabricated fact). Markers stay pinned on: marker validation
# is part of what the measurement is about, and a profile that silently turned them off would
# measure a different pipeline.
[[run_profiles]]
id = "ui-parity-standalone-audiobook"
tier = "full"
mode = "regression"
processing_operation = "audiobook"
enable_paragraph_markers = true
repeat_count = 1

