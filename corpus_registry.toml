# Spec 062 FR-007 / SC-002: the image-model comparison. Same shape as the profile above,
# but in the two semantic image modes and with the image models named explicitly, one
# profile per (mode, combination). "v1" = Variant 1 of the spec (gpt-5.4-mini reads,
# gpt-image-2.5-flare draws); "v2" = Variant 2 (gpt-6.1-sol reads, gpt-image-2.5-sunburst
