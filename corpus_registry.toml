[[documents]]
id = "mazzucato-pdf-full-benchmark"
source_path = "tests/sources/book/The Value of Everything. Making and Taking in the Global Economy by Mariana Mazzucato (z-lib.org).pdf"
artifact_prefix = "mazzucato_pdf_full_benchmark"
output_basename = "The_Value_of_Everything_pdf_full_benchmark"
structural_mode = "strict"
min_paragraphs = 1000
has_headings = true
min_headings = 20
has_numbered_lists = false
min_numbered_items = 0
has_images = false
min_images = 0
has_tables = false
min_tables = 0
