name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  editable-install:
    runs-on: ubuntu-latest

    steps:
      # Deliberately left at the default shallow depth: this job only proves the
      # editable install works and runs the pyright ratchet, and neither reads git
      # history. The `tests` job below needs `fetch-depth: 0` and says why — if a
      # history-reading test ever moves into this job, it has to move here too.
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean working tree before tests
        run: git clean -fdx

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify editable install
        run: |
          python -m pip install --upgrade pip
          python -m venv .venv
          . .venv/bin/activate
          pip install -e ".[dev]"
          python -c "import docxaicorrector"

      # A `pyright` fail-hard step lived here from 2026-05-12. It demanded zero errors
      # from a codebase already carrying ~271, so it failed on every run for two months
      # and — because `tests` needs this job — silently skipped the entire suite. The
      # ratchet below is the type signal now: it fails on any error ABOVE the recorded
      # baseline, so new debt is blocked while the standing debt does not gate the suite.
      - name: Run local pyright regression wrapper
        run: |
          . .venv/bin/activate
          bash scripts/test.sh tests/test_typecheck.py -q

  tests:
    runs-on: ubuntu-latest
    needs: [editable-install]
    env:
      DOCXAI_SKIP_WORKFLOW_SMOKE: "1"

    steps:
      # `fetch-depth: 0` is load-bearing, not tidiness. The default is a one-commit
      # shallow clone, and the static tier below carries a guard that checks
      # documents claiming "not started" against the commits that reference the
      # spec. With a shallow clone every history query comes back empty and that
      # guard would pass having checked nothing — the false green it was itself
      # written against. It fails loudly rather than skipping if this line is
      # removed, so a CI failure named `test_git_history_is_reachable` means this
      # setting, not a broken test.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean working tree before tests
        run: git clean -fdx

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m venv .venv
          . .venv/bin/activate
          pip install -r requirements.txt

      # Selected BY MARKER, not by a hand-maintained file list. The list used to be
      # spelled out here (and mirrored in two other places), so the sixth file to
      # carry `static_workflow` would have silently never run in CI: the full-suite
      # step below deselects the marker, and only files named here re-selected it.
      # `-m static_workflow` cannot drift — adding the marker is enough.
      - name: Run static workflow checks
        run: bash scripts/test.sh tests/ -q -m static_workflow

      - name: Run full test suite
        run: bash scripts/test.sh tests/ -q -m "not static_workflow and not typecheck and not system_deps and not manual_ai_heavy"
